[package]
name = "keepass-kbd"
authors = ["Boris Solodki <solboki@solodki.fr>"]
description = "Disposition clavier KeePass pour Sailfish OS"
license = "MIT"
version = "0.8.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
keepass = { version = "0.17", features = ["save_kdbx4"] }
libc = "0.2.191"
rand = "0.9"
rust-argon2 = "3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = "1.29.3"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
zeroize = "1.9.2"
